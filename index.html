<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treasure Below Wiki</title>
<meta name="description" content="The Treasure Below wiki: every pickaxe, ore, weapon, shield, armor set, enchant, spell, boss, monster, pet, quest and badge in the Roblox mining RPG.">
<meta property="og:title" content="Treasure Below Wiki">
<meta property="og:description" content="Every pickaxe, ore, enchant, boss and pet in Treasure Below, the medieval mining RPG on Roblox.">
<meta property="og:image" content="thumbnail.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a mine-shaft wiki. A sticky top bar with search, a tab column down the left (a row of
   tabs on phones), and the page in the middle. Dark soil palette, rarity colours carry meaning. */
:root {
  color-scheme: dark;
  --bg: #15110f;
  --bg-2: #1c1714;
  --panel: #221c18;
  --panel-2: #2a231e;
  --line: #3a3029;
  --text: #efe2c4;
  --muted: #b3a283;
  --faint: #7d6f5a;
  --gold: #e8b84a;
  --gold-deep: #8a6215;
  --ember: #ff6a2b;
  --jade: #6ee07a;

  --r-common: #b4b0a6; --r-uncommon: #7fcf6a; --r-rare: #5aa8f0; --r-epic: #b46cff;
  --r-legendary: #ffa53a; --r-mythic: #ff5c7a; --r-divine: #fff1a8; --r-celestial: #ffbe6a;
  --r-abyssal: #3ce8d6; --r-primordial: #aaff46; --r-ancient: #ffcb3c; --r-exclusive: #f5e6b0;
  --t-bronze: #cd8a4e; --t-silver: #c9ced6; --t-gold: #e8b84a; --t-mythic: #ff5c7a;

  --display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
  --top: 60px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.5; }
a { color: var(--gold); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2.2rem, 5vw, 3.2rem); line-height: 1.05; }
h2 { font-size: 1.7rem; line-height: 1.1; }
h3 { font-size: 1.25rem; line-height: 1.15; }
p { margin: 0; max-width: 70ch; }
.label { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* top bar */
.top { position: sticky; top: 0; z-index: 30; height: var(--top); display: flex; align-items: center; gap: 16px;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(#2a3a22, #1e2a19); border-bottom: 3px solid #4a6a35; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--gold); font-family: var(--display); font-size: 1.45rem; white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand img { width: 34px; height: 34px; border-radius: 6px; }
.brand small { font-family: var(--mono); font-size: 0.65rem; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.search { position: relative; flex: 1; max-width: 460px; margin-left: auto; }
.search input { width: 100%; height: 38px; border-radius: 6px; border: 1px solid #4a5a3c; background: rgba(0,0,0,.35); color: var(--text); padding: 0 12px 0 34px; font: inherit; }
.search::before { content: ""; position: absolute; left: 12px; top: 12px; width: 10px; height: 10px; border: 2px solid var(--muted); border-radius: 50%; }
.search::after { content: ""; position: absolute; left: 22px; top: 23px; width: 6px; height: 2px; background: var(--muted); transform: rotate(45deg); }
.results { position: absolute; top: 44px; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; max-height: 60vh; overflow: auto; box-shadow: 0 12px 30px rgba(0,0,0,.5); }
.results a { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; color: var(--text); border-bottom: 1px solid var(--line); }
.results a:hover, .results a.on { background: var(--panel-2); text-decoration: none; }
.results a span:last-child { color: var(--muted); font-size: .85rem; white-space: nowrap; }
.play { background: var(--gold); color: #2a1d07; font-weight: 700; padding: 8px 14px; border-radius: 5px; box-shadow: 0 3px 0 var(--gold-deep); white-space: nowrap; }
.play:hover { text-decoration: none; filter: brightness(1.08); }

/* shell */
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100vh - var(--top)); }
nav.tabs { position: sticky; top: var(--top); align-self: start; height: calc(100vh - var(--top)); overflow: auto; padding: 18px 10px 30px max(10px, env(safe-area-inset-left, 0px)); background: var(--bg-2); border-right: 1px solid var(--line); }
nav.tabs .group { margin: 14px 8px 6px; }
nav.tabs a { display: block; padding: 6px 10px; border-radius: 5px; color: var(--text); font-size: .98rem; }
nav.tabs a:hover { background: var(--panel); text-decoration: none; }
nav.tabs a.on { background: var(--panel-2); color: var(--gold); box-shadow: inset 3px 0 0 var(--gold); }
main { padding-block: 28px 80px; padding-left: max(16px, 2.2vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 2.2vw); min-width: 0; }
.page { max-width: 1120px; display: grid; gap: 22px; }
.head { display: grid; gap: 8px; }
.head p { color: var(--muted); }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-2); }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.wrap { white-space: normal; min-width: 240px; }
th { position: sticky; top: 0; background: var(--panel); font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; cursor: pointer; user-select: none; }
th:hover { color: var(--text); }
th.sorted { color: var(--gold); }
th .arrow { opacity: .8; margin-left: 4px; }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--panel); }
tbody tr:last-child td { border-bottom: 0; }
.name { font-weight: 700; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; transform: rotate(45deg); margin-right: 9px; vertical-align: 1px; background: var(--c); }

.chip { display: inline-block; font-size: .78rem; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--c); color: var(--c); white-space: nowrap; font-family: var(--body); }
.tag { display: inline-block; font-size: .78rem; padding: 1px 7px; border-radius: 4px; background: var(--panel-2); color: var(--muted); margin-right: 4px; white-space: nowrap; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filters button { font: inherit; font-size: .88rem; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; cursor: pointer; }
.filters button:hover { border-color: var(--muted); }
.filters button.on { background: var(--gold); color: #2a1d07; border-color: var(--gold); font-weight: 700; }
.filters .sep { width: 1px; height: 20px; background: var(--line); margin: 0 6px; }

/* cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
a.card { color: var(--text); }
a.card:hover { border-color: var(--c, var(--muted)); text-decoration: none; }
.card .top-line { border-top: 3px solid var(--c); margin: -16px -16px 4px; border-radius: 8px 8px 0 0; }
.card p { color: var(--muted); font-size: .95rem; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; font-size: .95rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

/* boss page */
.hpbar { height: 12px; background: var(--panel-2); border-radius: 3px; position: relative; overflow: hidden; }
.hpbar span { position: absolute; inset: 0 auto 0 0; background: var(--c); }
.bosshead { border-left: 4px solid var(--c); padding-left: 16px; display: grid; gap: 6px; }
.phases { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.phases li { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; }

/* drawer */
.drawer { position: fixed; top: var(--top); right: 0; bottom: 0; width: min(440px, 100%); background: var(--bg-2); border-left: 1px solid var(--line); z-index: 25; overflow: auto;
  padding: 22px max(20px, env(safe-area-inset-right, 0px)) calc(30px + env(safe-area-inset-bottom, 0px)) 22px; box-shadow: -20px 0 40px rgba(0,0,0,.45); display: grid; gap: 14px; align-content: start; }
.drawer .close { position: absolute; top: 14px; right: max(14px, env(safe-area-inset-right, 0px)); background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 6px; width: 34px; height: 34px; cursor: pointer; font-size: 1.1rem; }
.drawer .eyebrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.drawer h2 { padding-right: 44px; }
.desc { background: var(--panel); border-left: 3px solid var(--c, var(--gold)); padding: 10px 14px; border-radius: 0 6px 6px 0; }
.bars { display: grid; gap: 4px; }
.bar { display: grid; grid-template-columns: 9rem minmax(0, 1fr) 3.6rem; gap: 10px; align-items: center; font-size: .92rem; }
.bar i { height: 10px; border-radius: 2px; background: var(--c); display: block; }
.bar .track { background: var(--panel-2); border-radius: 2px; }

/* home */
.hero { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background:
  radial-gradient(120% 90% at 50% -20%, #5b7a46 0%, #3f5532 30%, transparent 62%), linear-gradient(#4a3a2c, #2c241e);
  padding: clamp(24px, 5vw, 48px); display: grid; gap: 14px; position: relative; }
.hero::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 8px; background: repeating-linear-gradient(90deg, #6a9a4a 0 18px, #5b8a3e 18px 30px, #7aab55 30px 40px); }
.hero h1 { font-size: clamp(2.6rem, 8vw, 5rem); color: var(--gold); text-shadow: 0 3px 0 #6b4a16; line-height: .95; }
.loop { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: var(--mono); font-size: .85rem; }
.loop span { background: rgba(0,0,0,.28); border: 1px solid rgba(239,226,196,.15); padding: 4px 10px; border-radius: 3px; }
.loop b { color: var(--gold); font-weight: 400; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.stats div { display: grid; }
.stats b { font-family: var(--mono); font-size: 1.4rem; color: var(--gold); font-weight: 500; }
.stats span { font-size: .85rem; color: var(--muted); }

.steps { counter-reset: s; display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
.steps li::before { content: counter(s); font-family: var(--mono); color: var(--gold); font-size: 1.1rem; }
.steps .lore { color: var(--muted); font-style: italic; font-size: .93rem; margin-top: 4px; }
blockquote { margin: 0; padding: 10px 14px; border-left: 3px solid var(--gold); background: var(--panel); border-radius: 0 6px 6px 0; color: var(--muted); font-style: italic; }
kbd { font-family: var(--mono); font-size: .8rem; min-width: 2.2rem; text-align: center; padding: 3px 8px; border-radius: 4px; background: #2a2420; border: 1px solid #4a3e33; box-shadow: 0 2px 0 #4a3e33; display: inline-block; }
.note { color: var(--faint); font-size: .88rem; }
footer { color: var(--faint); font-size: .85rem; margin-top: 30px; max-width: 1120px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  nav.tabs { position: sticky; top: var(--top); z-index: 20; height: auto; display: flex; gap: 4px; overflow-x: auto; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); border-right: 0; border-bottom: 1px solid var(--line); }
  nav.tabs .group { display: none; }
  nav.tabs a { white-space: nowrap; padding: 6px 10px; }
  nav.tabs a.on { box-shadow: inset 0 -2px 0 var(--gold); }
  .brand small, .play { display: none; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .bar { grid-template-columns: 6.5rem minmax(0, 1fr) 3rem; }
}
@media (max-width: 520px) { .brand span.word { display: none; } }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#home"><img src="icon.png" alt=""><span class="word">Treasure Below</span> <small>Wiki</small></a>
  <div class="search">
    <input id="q" type="search" placeholder="Search pickaxes, spells, bosses…" autocomplete="off" aria-label="Search the wiki">
    <div class="results" id="results" hidden></div>
  </div>
  <a class="play" href="https://www.roblox.com/games/139847927971793" target="_blank" rel="noopener">Play on Roblox</a>
</header>
<div class="shell">
  <nav class="tabs" id="tabs" aria-label="Wiki sections"></nav>
  <main id="main"></main>
</div>
<aside class="drawer" id="drawer" hidden aria-live="polite"></aside>

<script src="data.js"></script>
<script>
const G = window.GAME;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => (n == null || n === "" ? "–" : Number(n).toLocaleString("en-US"));
const pct = (n, d = 0) => (n == null ? "–" : (n * 100).toFixed(d) + "%");
const RVAR = { Common: "common", Uncommon: "uncommon", Rare: "rare", Epic: "epic", Legendary: "legendary", Mythic: "mythic", Divine: "divine", Celestial: "celestial", Abyssal: "abyssal", Primordial: "primordial", Ancient: "ancient", Exclusive: "exclusive", Bronze: "bronze", Silver: "silver", Gold: "gold" };
const TIER_ORDER = ["Common", "Uncommon", "Rare", "Epic", "Legendary", "Mythic", "Divine", "Celestial", "Abyssal", "Primordial", "Ancient", "Exclusive"];
const tierRank = t => { const i = TIER_ORDER.indexOf(t); return i < 0 ? 99 : i; };
const col = t => `var(--r-${RVAR[t] || "common"})`;
const chip = t => t ? `<span class="chip" style="--c:${col(t)}">${esc(t)}</span>` : "";
const dot = t => `<span class="dot" style="--c:${col(t)}"></span>`;
const slug = s => encodeURIComponent(s);
const bossName = k => G.bosses.items[k]?.Name || k;
const bossLink = k => `<a href="#boss/${slug(k)}">${esc(bossName(k))}</a>`;
const monsterName = k => G.monsters[k]?.Name || k;

// Where an item comes from
function source(it) {
  if (it.Shop === "Boss" && it.Drop) return { text: "Drops from " + bossName(it.Drop), html: "Drops from " + bossLink(it.Drop), kind: "Boss drop" };
  if (it.Quest) return { text: "Whiskers' Wares, after the Eclipse Prophecy", html: "Whiskers' Wares, after the <a href=\"#quests\">Eclipse Prophecy</a>", kind: "Quest" };
  if (it.Shop === "Abyss") {
    const gate = it.Root ? "the Withering Root" : it.Brood ? "the Brood Awakens" : "Whispers of the Void";
    return { text: "Old Tobias's forge, after " + gate, html: `Old Tobias's forge, after <a href="#quests">${gate}</a>`, kind: "Tobias" };
  }
  if (it.Shop === "Tree") return { text: "Bumbleworth's Honeyworks, after the Waking Tree", html: "Bumbleworth's Honeyworks, after <a href=\"#quests\">the Waking Tree</a>", kind: "Bumbleworth" };
  return { text: "Whiskers' Wares", html: "Whiskers' Wares", kind: "Shop" };
}
function price(it) { return it.Shop === "Boss" ? "Drop only" : it.Price ? fmt(it.Price) : "Starter"; }

// ---------------------------------------------------------------- routing
const NAV = [
  ["Start", [["home", "Home"], ["updates", "Updates"], ["zones", "World"], ["controls", "Controls"]]],
  ["Mining", [["ores", "Ores"], ["pickaxes", "Pickaxes"]]],
  ["Gear", [["weapons", "Weapons"], ["shields", "Shields"], ["armor", "Armor sets"], ["enchants", "Enchants"], ["spells", "Spells"]]],
  ["Fighting", [["bosses", "Bosses"], ["kingdom", "Goblin Kingdom"], ["monsters", "Monsters"]]],
  ["Progress", [["pets", "Pets & eggs"], ["quests", "Questlines"], ["badges", "Badges"], ["systems", "Forge, bags & more"]]],
];
$("#tabs").innerHTML = NAV.map(([g, items]) => `<div class="group label">${g}</div>` + items.map(([id, name]) => `<a href="#${id}" data-r="${id}">${name}</a>`).join("")).join("");

const PAGES = {};
let current = null;
// Open an item's panel without re-drawing the page (keeps the table's sort)
function openItem(page, k) {
  if (!OPENERS[page]) return;
  history.replaceState(null, "", "#" + page + "/" + slug(k));
  OPENERS[page](k);
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1) || "home");
  const [page, ...rest] = h.split("/");
  const arg = rest.join("/");
  if (page === current && arg && OPENERS[page]) { OPENERS[page](arg); return; }
  current = page;
  const render = PAGES[page] || PAGES.home;
  closeDrawer();
  $("#main").innerHTML = `<div class="page">${render(arg)}</div><footer>All numbers come straight from the game's data as of ${esc(G.updates[0]?.Title || "the latest")} update. Balance can change in future updates.</footer>`;
  document.querySelectorAll("nav.tabs a").forEach(a => a.classList.toggle("on", a.dataset.r === (page === "boss" ? "bosses" : page)));
  const on = document.querySelector("nav.tabs a.on");
  if (on && window.innerWidth <= 860) on.scrollIntoView({ inline: "center", block: "nearest" });
  wireTables();
  if (arg && OPENERS[page]) OPENERS[page](arg);
  if (!arg) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

// ---------------------------------------------------------------- tables
let TABLES = {};
function table(id, cols, rows, opener) {
  TABLES[id] = { cols, rows, opener, sort: null, dir: 1 };
  return `<div class="tablewrap"><table id="${id}"><thead><tr>${cols.map((c, i) => `<th data-i="${i}" class="${c.num ? "num" : ""}">${c.label}<span class="arrow"></span></th>`).join("")}</tr></thead><tbody>${body(id)}</tbody></table></div>`;
}
function body(id) {
  const t = TABLES[id];
  let rows = t.rows.slice();
  if (t.sort != null) {
    const c = t.cols[t.sort];
    const key = c.sort || (r => r[c.key]);
    rows.sort((a, b) => { const x = key(a), y = key(b); return (x > y ? 1 : x < y ? -1 : 0) * t.dir; });
  }
  return rows.map(r => `<tr data-k="${esc(r._key)}">${t.cols.map(c => `<td class="${c.num ? "num" : ""}${c.wrap ? " wrap" : ""}">${c.html ? c.html(r) : esc(r[c.key] ?? "–")}</td>`).join("")}</tr>`).join("");
}
function wireTables() {
  for (const id in TABLES) {
    const el = document.getElementById(id);
    if (!el) continue;
    const t = TABLES[id];
    el.querySelectorAll("th").forEach(th => th.onclick = () => {
      const i = +th.dataset.i;
      t.dir = t.sort === i ? -t.dir : (t.cols[i].num ? -1 : 1);
      t.sort = i;
      el.querySelector("tbody").innerHTML = body(id);
      el.querySelectorAll("th").forEach(x => { x.classList.toggle("sorted", x === th); x.querySelector(".arrow").textContent = x === th ? (t.dir > 0 ? "▲" : "▼") : ""; });
    });
    el.querySelector("tbody").onclick = e => {
      const tr = e.target.closest("tr");
      if (tr && !e.target.closest("a") && t.opener) t.opener(tr.dataset.k);
    };
  }
}

// ---------------------------------------------------------------- drawer
const OPENERS = {};
function openDrawer(html) {
  const d = $("#drawer");
  d.innerHTML = `<button class="close" aria-label="Close" onclick="closeDrawer()">✕</button>` + html;
  d.hidden = false;
  d.scrollTop = 0;
}
function closeDrawer() { $("#drawer").hidden = true; }
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeDrawer(); $("#results").hidden = true; } });
const kv = pairs => `<dl class="kv">${pairs.filter(p => p && p[1] != null && p[1] !== "").map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;

// ---------------------------------------------------------------- home
PAGES.home = () => {
  const up = G.updates[0];

// ---------------------------------------------------------------- weapons
function effects(w) {
  const e = [];
  if (w.Ranged) e.push("Ranged");
  if (w.Splash) e.push(`Splash ${w.Splash}`);
  if (w.Arc) e.push(`Arc ${w.Arc}°`);
  if (w.Pierce) e.push(`Pierces ${w.Pierce}`);
  if (w.Explode) e.push(`Explodes ${w.Explode}`);
  if (w.Stun) e.push(`Stun ${w.Stun}s`);
  if (w.Pull) e.push("Pulls in");
  if (w.Burn) e.push("Burns");
  if (w.Venom) e.push("Venom");
  if (w.Chill) e.push("Chills");
  if (w.FinisherBurst) e.push("Finisher burst");
  return e;
}

  const rows = G.weapons.order.map((k, i) => { const w = G.weapons.items[k]; return { _key: k, i, name: k, tier: w.Tier, dmg: w.Damage, range: w.Range, style: w.Style, fx: effects(w), price: w.Shop === "Boss" ? -1 : w.Price, src: source(w) }; });
  return `<div class="head"><span class="label">Gear</span><h1>Weapons</h1><p>Damage is per hit. Weapons go in hotbar slot 2. Boss weapons can't be bought: each boss drops its own at a 15% chance per win.</p></div>
  ${table("t-weapons", [
    { label: "Weapon", html: r => `${dot(r.tier)}<span class="name">${esc(r.name)}</span>`, sort: r => r.i },
    { label: "Tier", html: r => chip(r.tier), sort: r => tierRank(r.tier) },
    { label: "Damage", num: 1, key: "dmg", html: r => fmt(r.dmg) },
    { label: "Range", num: 1, key: "range" },
    { label: "Attack", html: r => esc(G.styles[r.style] || r.style), sort: r => r.style },
    { label: "Effects", html: r => r.fx.map(x => `<span class="tag">${x}</span>`).join("") || "–", sort: r => r.fx.length },
    { label: "Price / source", num: 1, html: r => r.price < 0 ? `<span class="muted">Drop</span>` : fmt(r.price), sort: r => r.price },

// ---------------------------------------------------------------- enchants
let enchantKind = "Weapon", enchantTier = "All";
PAGES.enchants = () => {
  const E = G.enchants;
  const order = enchantKind === "Weapon" ? E.weaponOrder : E.pickaxeOrder;
  const pre = enchantKind === "Weapon" ? "W:" : "P:";
  const rows = order.map((k, i) => ({ _key: k, i, name: k, tier: E.items[k].Rarity, chance: E.chances[pre + k] || 0, desc: E.items[k].Description })).filter(r => enchantTier === "All" || r.tier === enchantTier);
  const cost = enchantKind === "Weapon" ? E.cost : E.pickaxeCost;
  return `<div class="head"><span class="label">Gear</span><h1>Enchants</h1><p>Roll an enchant at the Enchanter's Altar in town. Each roll replaces the old enchant and costs <b>${fmt(cost.Gold)} gold + ${cost.OreAmount} ${esc(cost.Ore)}</b> for a ${enchantKind.toLowerCase()}. Chance is the odds of rolling that enchant on a normal roll. Focusing an enchant raises its odds.</p></div>
  <div class="filters">
    ${["Weapon", "Pickaxe"].map(k => `<button class="${enchantKind === k ? "on" : ""}" onclick="enchantKind='${k}';route()">${k} enchants (${(k === "Weapon" ? E.weaponOrder : E.pickaxeOrder).length})</button>`).join("")}
    <span class="sep"></span>
    ${["All", ...E.tiers].map(t => `<button class="${enchantTier === t ? "on" : ""}" onclick="enchantTier='${t}';route()">${t}</button>`).join("")}
  </div>
  ${table("t-ench", [
    { label: "Enchant", html: r => `${dot(r.tier)}<span class="name">${esc(r.name)}</span>`, sort: r => r.i },
    { label: "Rarity", html: r => chip(r.tier), sort: r => tierRank(r.tier) },
    { label: "Chance", num: 1, key: "chance", html: r => (r.chance * 100).toFixed(r.chance < 0.01 ? 2 : 1) + "%" },
    { label: "What it does", wrap: 1, key: "desc" },
  ], rows, k => openItem("enchants", k))}`;
};
OPENERS.enchants = k => {
  const e = G.enchants.items[k]; if (!e) return;
  const kind = e.For === "Pickaxe" ? "Pickaxe" : "Weapon";
  const ch = G.enchants.chances[(kind === "Weapon" ? "W:" : "P:") + k];
  const skip = new Set(["Rarity", "Color", "Description", "Weight", "For"]);
  const raw = Object.entries(e).filter(([a, v]) => !skip.has(a) && typeof v !== "object").map(([a, v]) => [a.replace(/([a-z])([A-Z])/g, "$1 $2"), esc(v)]);
  openDrawer(`<div class="eyebrow">${chip(e.Rarity)}<span class="label">${kind} enchant</span></div><h2>${esc(k)}</h2>
    <div class="desc" style="--c:${e.Color}">${esc(e.Description)}</div>
    ${kv([["Rarity", esc(e.Rarity)], ["Roll chance", ch != null ? (ch * 100).toFixed(2) + "%" : "–"], ["Goes on", kind === "Weapon" ? "Weapons" : "Pickaxes"]])}
    ${raw.length ? `<span class="label">Numbers</span>${kv(raw)}` : ""}`);
};

  for (const k of G.bosses.order) { const b = G.bosses.items[k]; (byGroup[b.Group] ||= []).push(k); }
  return `<div class="head"><span class="label">Fighting</span><h1>Bosses</h1><p>Raid bosses have phases, telegraphed attacks and summons. Their health grows by ${pct(G.bosses.healthPerExtra)} for every extra player. Most drop their own armor set, shield and weapon (${pct(G.loot.chance)} per win). Click a boss for its fight guide.</p></div>
  ${G.bosses.groupOrder.filter(g => byGroup[g]).map(g => `<section class="head"><h2>${g}</h2>
    <div class="grid">${byGroup[g].map(k => { const b = G.bosses.items[k]; return `<a class="card" href="#boss/${slug(k)}" style="--c:${b.Color}"><div class="top-line"></div>
      <span class="label">${esc(b.Title)}</span><h3>${esc(b.Name)}</h3>
      <div class="hpbar" style="--c:${b.Color}"><span style="width:${Math.min(b.Health / max, 1) * 100}%"></span></div>
      <p class="mono">${fmt(b.Health)} HP · ${fmt(b.Reward)} gold${b.Loot ? " · drops gear" : ""}</p></a>`; }).join("")}</div></section>`).join("")}`;
};
PAGES.boss = k => {
  const b = G.bosses.items[k];
  if (!b) return PAGES.bosses();
  const L = b.Loot;
  let loot = "";
  if (L) {
    const set = G.armor.sets[L.Set];
    loot = `<section class="head"><h2>Drops</h2><p class="muted">${pct(G.loot.chance)} chance per win that one piece you don't own yet drops. The weapon is the rarest.</p>
    <div class="grid">
      <a class="card" href="#armor/${slug(L.Set)}" style="--c:${col(set.Tier)}"><div class="top-line"></div><span class="label">Armor set</span><h3>${esc(set.Display)}</h3><p>${["Helmet", "Chestplate", "Greaves"].map(s => esc(set.Pieces[s].Name)).join(", ")}</p>${set.Perk ? `<p>Full set: ${esc(set.Perk)}</p>` : ""}</a>
      <a class="card" href="#shields/${slug(L.Gear)}" style="--c:${col(G.shields.items[L.Gear].Tier)}"><div class="top-line"></div><span class="label">Shield</span><h3>${esc(L.Gear)}</h3><p>${esc(G.shields.items[L.Gear].Perk || "")}</p></a>
      <a class="card" href="#weapons/${slug(L.Weapon)}" style="--c:${col(G.weapons.items[L.Weapon].Tier)}"><div class="top-line"></div><span class="label">Weapon</span><h3>${esc(L.Weapon)}</h3><p>${fmt(G.weapons.items[L.Weapon].Damage)} damage · ${esc(G.styles[G.weapons.items[L.Weapon].Style] || "")}</p></a>
    </div></section>`;
  }
  return `<p><a href="#bosses">← All bosses</a></p>
  <div class="bosshead" style="--c:${b.Color}"><span class="label">${esc(b.Group)} · ${esc(b.Title)}</span><h1>${esc(b.Name)}</h1></div>
  <div class="card">${kv([["Health", fmt(b.Health) + " (solo)"], ["Reward", fmt(b.Reward) + " gold"], ["Difficulty", esc(b.Difficulty)], ["Arena", esc(b.Arena)], ["Where", esc(b.Where)], ["Recommended", esc(b.Recommended)], ["Unlocked by", b.Quest ? "<a href=\"#quests\">The Eclipse Prophecy</a>" : b.Group === "Goblin Kingdom" ? "<a href=\"#kingdom\">Reaching its floor</a>" : null]])}</div>
  ${b.Notes.length ? `<section class="head"><h2>The fight</h2><ul class="phases">${b.Notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></section>` : ""}
  ${loot}`;
};

// ---------------------------------------------------------------- kingdom
PAGES.kingdom = () => {
  const hp = f => (1 + 0.07 * (Math.min(f, 50) - 1)) * Math.pow(1.05, Math.max(f - 50, 0));
  const dmg = f => (1 + 0.035 * (Math.min(f, 50) - 1)) * Math.pow(1.03, Math.max(f - 50, 0));
  const floors = [1, 10, 20, 30, 40, 50, 60, 75, 100].map(f => ({ _key: f, f, hp: hp(f), dmg: dmg(f), gold: 1500 + 500 * f }));
  return `<div class="head"><span class="label">Fighting</span><h1>The Goblin Kingdom</h1><p>An endless raid beneath the Goblin Fort. Beat <a href="#boss/Warchief">Kragmaw the Warchief</a> once to open the Kingdom Gate, just inside the Fort's north wall.</p></div>
  <div class="grid">
    <div class="card"><h3>How a run works</h3><p>One run per server. The first player in starts an ${G.kingdom.countdown}-second countdown, and anyone who has opened the gate can join while it's going. <b>Every run starts on floor 1.</b> Dying or leaving through the exit ends your run.</p></div>
    <div class="card"><h3>Floors</h3><p>Each floor is a wave of Kingdom goblins coming through the four gates. Clear it for gold (${G.kingdom.floorGold}). Everyone still standing heals ${pct(G.kingdom.heal)}, and after a ${G.kingdom.break}-second break the next floor starts.</p></div>
    <div class="card"><h3>Endless</h3><p>Every 10th floor is a boss. Past floor 50 the bosses come back with ×1.8 health and ×1.3 damage each lap, and pay 50% more. Your deepest floor is saved and ranked on the Kingdom leaderboard.</p></div>
  </div>
  <section class="head"><h2>Boss floors</h2><div class="grid">${G.kingdom.bossFloors.map(({ floor, key }) => { const b = G.bosses.items[key]; return `<a class="card" href="#boss/${slug(key)}" style="--c:${b.Color}"><div class="top-line"></div><span class="label">Floor ${floor}</span><h3>${esc(b.Name)}</h3><p>${esc(b.Title)} · ${fmt(b.Health)} HP</p></a>`; }).join("")}</div></section>
  <section class="head"><h2>How hard it gets</h2><p class="muted">Monster health and damage compared with floor 1, and the gold for clearing each floor.</p>
  ${table("t-floors", [
    { label: "Floor", num: 1, key: "f" },
    { label: "Monster health", num: 1, key: "hp", html: r => "×" + r.hp.toFixed(2) },
    { label: "Monster damage", num: 1, key: "dmg", html: r => "×" + r.dmg.toFixed(2) },
    { label: "Floor gold", num: 1, key: "gold", html: r => fmt(r.gold) },
  ], floors, null)}</section>
  <section class="head"><h2>Monsters by depth</h2><p class="muted">Floors 1–9: Kingdom Guards and Warband Raiders. From 11: Berserkers and Warband Brutes join. From 31: Kingdom Champions.</p></section>
  <section class="head"><h2>Floor badges</h2><p class="muted">Into the Kingdom (10), Deep Delver (25), Throne Room (50), Beyond the Throne (75), Endless (100). See <a href="#badges">Badges</a>.</p></section>`;
};

// ---------------------------------------------------------------- monsters
PAGES.monsters = () => {
  const rows = Object.entries(G.monsters).map(([k, m]) => ({ _key: k, name: m.Name, hp: m.Health, dmg: m.Damage, speed: m.Speed, coins: m.Coins, where: m.Where || "", elite: m.Elite || m.Helmet }));
  rows.sort((a, b) => a.hp - b.hp);
  return `<div class="head"><span class="label">Fighting</span><h1>Monsters</h1><p>Base stats. In the Goblin Kingdom, monsters get tougher every floor.</p></div>
  ${table("t-mon", [
    { label: "Monster", html: r => `<span class="name">${esc(r.name)}</span>`, sort: r => r.name },
    { label: "Health", num: 1, key: "hp", html: r => fmt(r.hp) },
    { label: "Damage", num: 1, key: "dmg", html: r => fmt(r.dmg) },
    { label: "Speed", num: 1, key: "speed" },
    { label: "Coins", num: 1, html: r => r.coins ? r.coins.join("–") : "–", sort: r => r.coins?.[1] },
    { label: "Where", wrap: 1, key: "where" },
  ], rows, k => openItem("monsters", k))}`;
};
OPENERS.monsters = k => {
  const m = G.monsters[k]; if (!m) return;
  openDrawer(`<span class="label">Monster</span><h2>${esc(m.Name)}</h2>
    ${kv([["Health", fmt(m.Health)], ["Damage", fmt(m.Damage)], ["Speed", m.Speed], ["Attack every", m.AttackCooldown + " s"], ["Reach", m.AttackRange + " studs"], ["Shoots from", m.Range && m.Range + " studs"], ["Spits", m.Spit && `from ${m.Spit.Range} studs, slows you`], ["Coins dropped", m.Coins && m.Coins.join("–")], ["Where", esc(m.Where)], ["Elite", m.Elite ? "Yes (counts double for pet growth)" : null]])}`);
};

// ---------------------------------------------------------------- pets
PAGES.pets = () => {
  const P = G.pets;
  const rows = P.order.filter(k => !P.items[k].Hidden).map((k, i) => { const p = P.items[k]; const a = P.attacks[k] || {}; return { _key: k, i, name: k, tier: p.Rarity, speed: p.Speed, fly: p.FlySpeed || (p.Flyer ? p.Speed : 0), atk: a.Name, dmg: a.Damage, cd: a.Cooldown }; });
  return `<div class="head"><span class="label">Progress</span><h1>Pets & eggs</h1><p>Hatch eggs at the Hatchery (the Void and Brood eggs have their own spots). Pets grow from Baby (0) to Young (${fmt(P.stageGrowth.Young)} growth) to Adult (${fmt(P.stageGrowth.Adult)}) as you mine, fight and feed them. Adults can be ridden, and flyers can take off. You can have up to ${P.maxSlots} pets out at once.</p></div>
  <section class="head"><h2>Eggs</h2><div class="grid">${P.eggOrder.map(e => { const egg = P.eggs[e]; const odds = P.eggChances[e] || []; return `<div class="card" style="--c:${egg.Spots || "var(--gold)"}"><div class="top-line"></div><span class="label">${fmt(egg.Price)} gold${egg.Where ? " · " + esc(egg.Where) : ""}</span><h3>${esc(e)}</h3>
    <div class="bars">${odds.map(o => `<div class="bar" style="--c:${col(P.items[o.Species]?.Rarity)}"><a href="#pets/${slug(o.Species)}">${esc(o.Species)}</a><span class="track"><i style="width:${o.Percent}%"></i></span><span class="mono">${(+o.Percent).toFixed(0)}%</span></div>`).join("")}</div></div>`; }).join("")}</div></section>
  <section class="head"><h2>All pets</h2>
  ${table("t-pets", [
    { label: "Pet", html: r => `${dot(r.tier)}<span class="name">${esc(r.name)}</span>`, sort: r => r.i },
    { label: "Rarity", html: r => chip(r.tier), sort: r => tierRank(r.tier) },
    { label: "Ride speed", num: 1, key: "speed" },
    { label: "Fly speed", num: 1, key: "fly", html: r => r.fly || "–" },
    { label: "Attack", key: "atk" },
    { label: "Damage", num: 1, key: "dmg" },
    { label: "Every", num: 1, key: "cd", html: r => r.cd ? r.cd + "s" : "–" },
  ], rows, k => openItem("pets", k))}</section>
  <section class="head"><h2>Pet slots</h2><p class="muted">Start with 1. Buy more at the Hatchery: ${Object.entries(P.slotPrices).sort((a, b) => a[0] - b[0]).map(([n, p]) => `slot ${n} for ${fmt(p)} gold`).join(", ")}.</p></section>`;
};
OPENERS.pets = k => {
  const p = G.pets.items[k]; if (!p) return;
  const a = G.pets.attacks[k] || {};
  const eggs = G.pets.eggOrder.filter(e => (G.pets.eggChances[e] || []).some(o => o.Species === k)).map(e => { const o = G.pets.eggChances[e].find(o => o.Species === k); return `${esc(e)} (${(+o.Percent).toFixed(0)}%)`; });
  openDrawer(`<div class="eyebrow">${chip(p.Rarity)}<span class="label">Pet</span></div><h2>${esc(k)}</h2>
    ${p.Blurb ? `<div class="desc" style="--c:${col(p.Rarity)}">${esc(p.Blurb)}</div>` : ""}
    ${kv([["Ride speed", p.Speed], ["Flies", p.Flyer ? "Yes" + (p.FlySpeed ? `, at ${p.FlySpeed}` : "") : "No"], ["Attack", a.Name && `${esc(a.Name)}: ${a.Damage} damage every ${a.Cooldown} s, reach ${a.Range}`], ["Hatches from", eggs.join(", ") || "Not from an egg"]])}`);
};

// ---------------------------------------------------------------- quests
const QORDER = [["QuestData", "Opens the Eclipse gear and pickaxe"], ["VoidQuestData", "Opens The Abyss and Old Tobias's forge"], ["SkyQuestData", "Opens Skyreach and the Sky Lift"], ["BroodQuestData", "Opens the Broodhollow and Brood gear"], ["RootQuestData", "Opens Rootdeep and its gear"], ["TreeQuestData", "Grows the world-tree: the Heartwood Hollow, the Beehive and Bumbleworth's pickaxes"]];
PAGES.quests = () => `<div class="head"><span class="label">Progress</span><h1>Questlines</h1><p>Six storylines. Each opens a new part of the world. Tribute steps take ore from your bag.</p></div>
  ${QORDER.map(([id, opens]) => { const q = G.quests[id]; return `<section class="card"><span class="label">${esc(q.giver || "")} · ${opens}</span><h2>${esc(q.name)}</h2><blockquote>${esc(q.intro)}</blockquote>
    <ol class="steps">${q.steps.map(s => `<li><div><b>${esc(s.Title)}</b> <span class="muted">· ${esc(s.Goal)}${s.Count && !/\d/.test(s.Goal) ? " (" + s.Count + ")" : ""}</span><div class="lore">${esc(s.Lore)}</div></div></li>`).join("")}</ol>
    <p class="muted"><b>When you finish:</b> ${esc(q.finished)}</p></section>`; }).join("")}`;

// ---------------------------------------------------------------- badges
let badgeTier = "All";
PAGES.badges = () => {
  const rows = G.badges.filter(b => badgeTier === "All" || b.Tier === badgeTier).map(b => ({ _key: b.Id, o: b.Order, icon: b.Icon, name: b.Name, desc: b.Desc, tier: b.Tier, reward: b.Reward || 0 }));
  const total = G.badges.reduce((s, b) => s + (b.Reward || 0), 0);
  return `<div class="head"><span class="label">Progress</span><h1>Badges</h1><p>${G.badges.length} badges in the Journal, worth ${fmt(total)} gold altogether. Past progress counts: boss and ore badges are also awarded from your Collection Book.</p></div>
  <div class="filters">${["All", "Bronze", "Silver", "Gold", "Mythic"].map(t => `<button class="${badgeTier === t ? "on" : ""}" onclick="badgeTier='${t}';route()">${t}</button>`).join("")}</div>
  ${table("t-badges", [
    { label: "", html: r => esc(r.icon), sort: r => r.o },
    { label: "Badge", html: r => `<span class="name">${esc(r.name)}</span>`, sort: r => r.name },
    { label: "How to get it", wrap: 1, key: "desc" },
    { label: "Tier", html: r => `<span class="chip" style="--c:var(--t-${r.tier.toLowerCase()})">${r.tier}</span>`, sort: r => ["Bronze", "Silver", "Gold", "Mythic"].indexOf(r.tier) },
    { label: "Reward", num: 1, key: "reward", html: r => r.reward ? fmt(r.reward) : "–" },
  ], rows, null)}`;
};

// ---------------------------------------------------------------- systems
PAGES.systems = () => {
  const F = G.fortify;
  const fortRows = F.cost.map((c, i) => ({ _key: i + 1, lvl: i + 1, ore: c.Ore, gold: c.Gold }));
  const bagRows = G.bag.map((b, i) => ({ _key: b.Name, i, name: b.Name, cap: b.Capacity, cost: b.Cost, ore: b.Ore ? `${b.Ore[1]} ${b.Ore[0]}` : "", blurb: b.Blurb }));
  const rebRows = G.rebirth.costs.map((c, i) => ({ _key: i + 1, n: i + 1, cost: c, sell: 1 + G.rebirth.sellBonus * (i + 1), power: 1 + G.rebirth.powerBonus * (i + 1) }));
  return `<div class="head"><span class="label">Progress</span><h1>Forge, bags & more</h1></div>
  <section class="head"><h2>Grimbold's Forge</h2><p class="muted">Every pickaxe, weapon, shield and armor piece has ${F.maxLevel} fortify levels, each set with one ore. Better ore gives a bigger bonus (see the forge column on <a href="#ores">Ores</a>, from +1% for Stone to +6.3% for Elderbloom). Once all ${F.maxLevel} are set, you can reforge the weakest level with a better ore. Fortify levels survive a rebirth.</p>
  ${table("t-fort", [{ label: "Level", num: 1, key: "lvl" }, { label: "Ore needed", num: 1, key: "ore" }, { label: "Gold", num: 1, key: "gold", html: r => fmt(r.gold) }], fortRows, null)}</section>
  <section class="head"><h2>Bags (Pip's Packs)</h2><p class="muted">How much ore you can carry before you have to sell.</p>
  ${table("t-bag", [{ label: "Bag", html: r => `<span class="name">${esc(r.name)}</span>`, sort: r => r.i }, { label: "Holds", num: 1, key: "cap", html: r => fmt(r.cap) }, { label: "Price", num: 1, key: "cost", html: r => r.cost ? fmt(r.cost) : "Starter" }, { label: "Also needs", key: "ore" }, { label: "", wrap: 1, key: "blurb" }], bagRows, null)}</section>
  <section class="head"><h2>Rebirth</h2><p class="muted">Start over with your gold and gear reset (your stats, pets, badges and fortifies stay) for a permanent boost: +${pct(G.rebirth.sellBonus)} sell price and +${pct(G.rebirth.powerBonus)} mining power per rebirth.</p>
  ${table("t-reb", [{ label: "Rebirth", num: 1, key: "n" }, { label: "Cost", num: 1, key: "cost", html: r => fmt(r.cost) }, { label: "Sell price", num: 1, key: "sell", html: r => "×" + r.sell.toFixed(2) }, { label: "Mining power", num: 1, key: "power", html: r => "×" + r.power.toFixed(2) }], rebRows, null)}</section>
  <section class="head"><h2>Collection Book</h2><p class="muted">Press K to open it. Every new ore, creature, piece of gear and pet you find is recorded. Each page pays gold at 25%, 50%, 75% and 100% (${G.collection.milestones.map(m => fmt(m.Gold)).join(" / ")}) and a permanent perk when finished.</p>
  <div class="grid">${G.collection.pages.map(p => `<div class="card"><span class="label">${p.count} entries</span><h3>${esc(p.title)}</h3><p><b>${esc(p.perk.Name)}:</b> ${esc(p.perk.Text)}</p></div>`).join("")}</div></section>
  <section class="head" id="events"><h2>World events</h2><p class="muted">Every few minutes something happens for the whole server. A banner at the top shows what to do and the time left. Rewards marked "weapon" grow with your weapon's damage, so they're worth doing all game.</p>
  <div class="grid">${G.events.map(e => `<div class="card"><span class="label">${esc(e.time)}</span><h3>${esc(e.name)}</h3><p>${esc(e.text)}</p><p class="muted"><b>Reward:</b> ${esc(e.reward)}</p></div>`).join("")}</div></section>
  <section class="head"><h2>Daily quests & login streak</h2><p class="muted">Three new quests every day, one from each tier, plus a login reward that grows with your streak. Rewards scale up with your rebirths.</p>
  <div class="grid">${G.daily.tiers.map(t => `<div class="card" style="--c:${t.Color}"><div class="top-line"></div><h3>${esc(t.Name)}</h3><p>${fmt(t.Reward)} gold</p></div>`).join("")}</div></section>`;
};

// ---------------------------------------------------------------- controls
PAGES.controls = () => `<div class="head"><span class="label">Start</span><h1>Controls</h1><p>Every action can be rebound in the Keys menu. Controllers get a free-moving menu cursor, and phones get a ring of touch buttons.</p></div>
  <div class="card">${kv([["<kbd>Click</kbd>", "Mine and attack"], ["<kbd>1</kbd> <kbd>2</kbd>", "Pickaxe / weapon"], ["<kbd>F</kbd>", "Block. Raise it just before a hit lands to parry"], ["<kbd>G</kbd>", "Cast your spell (learn magic from Granny Hexley)"], ["<kbd>Shift</kbd>", "Sprint (uses stamina)"], ["<kbd>E</kbd>", "Talk, open, use"], ["<kbd>R</kbd>", "Ride your pet (grown pets only)"], ["<kbd>Space</kbd>", "Jump. While riding a flyer: take off and climb"], ["<kbd>Ctrl</kbd> / <kbd>Q</kbd>", "Dive while flying"], ["<kbd>B</kbd>", "Inventory"], ["<kbd>P</kbd>", "Pets"], ["<kbd>K</kbd>", "Collection Book"]])}</div>
  <div class="card"><h3>Xbox</h3><p>Hold LT to block, Y to ride, click R3 to cast your spell, and click L3 while moving to sprint. Menus use a free-moving cursor.</p></div>`;

// ---------------------------------------------------------------- search
const INDEX = [];
const add = (name, kind, href, extra = "") => INDEX.push({ name, kind, href, hay: (name + " " + extra).toLowerCase() });
G.pickaxes.order.forEach(k => add(k, "Pickaxe", "#pickaxes/" + slug(k)));
G.ores.order.forEach(k => add(k, "Ore", "#ores/" + slug(k), G.ores.items[k].Display));
G.weapons.order.forEach(k => add(k, "Weapon", "#weapons/" + slug(k)));
G.shields.order.forEach(k => add(k, "Shield", "#shields/" + slug(k)));
G.armor.order.forEach(k => { const s = G.armor.sets[k]; add(s.Display, "Armor set", "#armor/" + slug(k)); ["Helmet", "Chestplate", "Greaves"].forEach(p => add(s.Pieces[p].Name, "Armor", "#armor/" + slug(k))); });
G.enchants.weaponOrder.forEach(k => add(k, "Weapon enchant", "#enchants/" + slug(k), G.enchants.items[k].Description));
G.enchants.pickaxeOrder.forEach(k => add(k, "Pickaxe enchant", "#enchants/" + slug(k), G.enchants.items[k].Description));
G.spells.order.forEach(k => add(k, "Spell", "#spells/" + slug(k), G.spells.items[k].Description));
add("Granny Hexley", "Witch", "#spells", "magic witch spells cauldron");
G.bosses.order.forEach(k => add(G.bosses.items[k].Name, "Boss", "#boss/" + slug(k), G.bosses.items[k].Title));
Object.entries(G.monsters).forEach(([k, m]) => add(m.Name, "Monster", "#monsters/" + slug(k)));
G.pets.order.filter(k => !G.pets.items[k].Hidden).forEach(k => add(k, "Pet", "#pets/" + slug(k)));
G.pets.eggOrder.forEach(k => add(k, "Egg", "#pets"));
Object.values(G.quests).forEach(q => add(q.name, "Questline", "#quests", q.giver));
G.badges.forEach(b => add(b.Name, "Badge", "#badges", b.Desc));
G.zones.forEach(z => add(z.name, "Zone", "#zones"));
G.events.forEach(e => add(e.name, "World event", "#systems", e.text));

const q = $("#q"), res = $("#results");
let hits = [], sel = 0;
function showResults() {
  const s = q.value.trim().toLowerCase();
  if (!s) { res.hidden = true; return; }
  hits = INDEX.filter(e => e.hay.includes(s)).sort((a, b) => (b.name.toLowerCase().startsWith(s)) - (a.name.toLowerCase().startsWith(s))).slice(0, 14);
  sel = 0;
  res.innerHTML = hits.length ? hits.map((h, i) => `<a href="${h.href}" class="${i === sel ? "on" : ""}"><span>${esc(h.name)}</span><span>${h.kind}</span></a>`).join("") : `<a><span class="muted">Nothing found for "${esc(q.value)}"</span><span></span></a>`;
  res.hidden = false;
}
q.addEventListener("input", showResults);
q.addEventListener("keydown", e => {
  if (res.hidden || !hits.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length; res.querySelectorAll("a").forEach((a, i) => a.classList.toggle("on", i === sel)); }
  if (e.key === "Enter") { location.hash = hits[sel].href; res.hidden = true; q.blur(); }
});
res.addEventListener("click", e => { if (e.target.closest("a")) { res.hidden = true; q.value = ""; } });
document.addEventListener("click", e => { if (!e.target.closest(".search")) res.hidden = true; });

route();
</script>
</body>
